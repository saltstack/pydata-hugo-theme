baseURL = 'https://saltstack.github.io/pydata-hugo-theme/'
locale  = 'en-US'
title   = 'pydata-hugo-theme'

[module]
  [[module.imports]]
    path = "github.com/saltstack/pydata-hugo-theme"

[menus]
  [[menus.main]]
    name    = 'Docs'
    pageRef = '/'
    weight  = 10

