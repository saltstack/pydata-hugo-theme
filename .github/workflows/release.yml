# Runs when a version tag is pushed. Validates that the tagged commit
# actually builds (docs/ + exampleSite/), then publishes a (non-draft)
# GitHub Release with the Cocogitto-generated changelog section for that
# version as the release notes.
#
# Hugo Modules have no package-registry publish step -- the pushed git tag
# itself is the published artifact, resolved directly by the Go module
# proxy from this public repo. This workflow's only job is to confirm the
# tag is buildable and to give it a human-readable release page.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-check:
    name: Verify tagged commit builds
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Resolve Hugo version
        id: hugo-version
        run: echo "version=$(cat .hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${{ steps.hugo-version.outputs.version }}/hugo_extended_${{ steps.hugo-version.outputs.version }}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: '.go-version'

      - name: Install npm dependencies
        run: npm ci

      - name: Build docs/
        working-directory: docs
        run: hugo --minify --baseURL "https://saltstack.github.io/pydata-hugo-theme/"

      - name: Build exampleSite/
        working-directory: exampleSite
        run: hugo --minify

  release:
    name: Publish GitHub Release
    needs: build-check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Required: Cocogitto needs history back to the previous tag to
          # generate this version's changelog section
          fetch-depth: 0

      - name: Cache Cocogitto binary
        id: cache-cog
        uses: actions/cache@v4
        with:
          path: /root/.local/bin/cog
          key: cog-${{ hashFiles('.devcontainer/cog-version') }}

      - name: Install Cocogitto
        if: steps.cache-cog.outputs.cache-hit != 'true'
        run: |
          COG_VERSION=$(cat .devcontainer/cog-version)
          curl -fSsL "https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}/cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/cog.tar.gz
          mkdir -p /root/.local/bin
          tar -xvf /tmp/cog.tar.gz -C /root/.local/bin/ --strip-components=1 x86_64-unknown-linux-musl/cog
          rm /tmp/cog.tar.gz

      - name: Add Cocogitto to PATH
        run: echo "/root/.local/bin" >> "$GITHUB_PATH"

      - name: Generate changelog section for this tag
        run: cog changelog --at "${{ github.ref_name }}" > /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md
