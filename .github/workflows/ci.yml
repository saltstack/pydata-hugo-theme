# Validates every PR and push to main: conventional-commit message
# validation via Cocogitto, plus a Hugo build check of docs/ and
# exampleSite/ (the only two "consumers" of this module's own templates
# checked into this repo -- there's no compilable Go source to build/test/
# lint, so a successful Hugo build is the closest thing this repo has to a
# test suite).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # On PRs, groups by branch name (canceling old runs).
  # On pushes (like main), falls back to run_id (never cancels).
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  cog-check:
    name: Validate conventional commits
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Required: fetch all history so Cocogitto can validate the commit log
          fetch-depth: 0

      - name: Cache Cocogitto binary
        id: cache-cog
        uses: actions/cache@v4
        with:
          path: /root/.local/bin/cog
          key: cog-${{ hashFiles('.devcontainer/cog-version') }}

      - name: Install Cocogitto
        if: steps.cache-cog.outputs.cache-hit != 'true'
        run: |
          COG_VERSION=$(cat .devcontainer/cog-version)
          echo "Downloading Cocogitto v${COG_VERSION}..."
          curl -fSsL "https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}/cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/cog.tar.gz
          mkdir -p /root/.local/bin
          tar -xvf /tmp/cog.tar.gz -C /root/.local/bin/ --strip-components=1 x86_64-unknown-linux-musl/cog
          rm /tmp/cog.tar.gz

      - name: Add Cocogitto to PATH
        run: echo "/root/.local/bin" >> "$GITHUB_PATH"

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          echo "Checking commits from origin/${{ github.base_ref }} to HEAD"
          cog check origin/${{ github.base_ref }}..HEAD

      - name: Validate entire history (main branch)
        if: github.event_name == 'push'
        run: cog check

  hugo-build:
    name: Hugo build check (docs/ + exampleSite/)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Resolve Hugo version
        id: hugo-version
        run: echo "version=$(cat .hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${{ steps.hugo-version.outputs.version }}/hugo_extended_${{ steps.hugo-version.outputs.version }}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: '.go-version'

      - name: Install Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build docs/
        working-directory: docs
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache_docs
        run: hugo --minify --baseURL "https://saltstack.github.io/pydata-hugo-theme/"

      - name: Build exampleSite/
        working-directory: exampleSite
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache_example
        run: hugo --minify
